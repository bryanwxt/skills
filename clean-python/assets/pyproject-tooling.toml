# Starter tool configuration for a Python project.
# Merge these sections into the project's pyproject.toml and adjust paths/versions.
# Install: pip install black ruff mypy pytest pytest-cov hypothesis
# Run in CI:  black --check . && ruff check . && mypy src && pytest

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes; I: import sorting; B: bugbear (mutable defaults, etc.);
# UP: modern syntax; SIM: simplifications; BLE: blind except; PL: pylint rules; C4: comprehensions
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "PL", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Relax per-module for legacy code, e.g.:
# [[tool.mypy.overrides]]
# module = "legacy.*"
# disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing"

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
